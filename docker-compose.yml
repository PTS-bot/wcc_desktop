
services:

# ---------------------------------------------------------------------------------------------------------

  gateway:
    build: 
      context: .
      dockerfile: dockerfile.gateway  
    container_name: web-gateway
    volumes:
    #   - ./web_porxy_nginx:/var/www/dashboard    
      - ./web_proxy_nginx:/usr/share/nginx/html # 👈 Map ไฟล์ HTML
      - ./web_proxy_nginx/nginx.conf:/etc/nginx/nginx.conf # 👈 Map Config Nginx
    ports:
      - "6688:8080"
    depends_on:
      - auth-service         

  auth-service:
    image: node:18-alpine  # ใช้ Image Node สำเร็จรูป ไม่ต้อง install เอง
    container_name: auth-service
    working_dir: /app
    volumes:
      # ✅ ใช้ Volume เดียวกับ Nginx เลย เพื่อให้อ่านไฟล์ users.json ตัวเดียวกันได้
      - ./web_proxy_node:/app 
    command: sh -c "npm install express body-parser cors express-session mongoose && node server.js"
    # ports:
    #   - "3000:3000"
    restart: always
    depends_on:
      - mongo # บอกให้รอ mongo รันก่อน (ระดับ network)

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    # ports:
    #   - "27017:27017"
    volumes:
      - ./web_proxy_mongo:/data/db  # Map ข้อมูลออกมาข้างนอก กันข้อมูลหาย



# -------------------------------------------------------------------------------------------------------
 

  webtop1:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: webtop1
    security_opt:
      - seccomp:unconfined # จำเป็นเพื่อให้บางโปรแกรมทำงานได้สมบูรณ์
    environment:
      - PUID=1000 # User ID
      - PGID=1000 # Group ID
      - TZ=Asia/Bangkok # ตั้งเวลาเป็นไทย
      - SUBFOLDER=/webtop1/ # (Optional) ถ้าใช้ Reverse Proxy
      # - KEYBOARD=en-us-qwerty # (Optional) ตั้งค่าคีย์บอร์ด
    # volumes:
    #   - ./work_space/web_desktop:/config # เก็บข้อมูล Home Directory ไว้ที่นี่เพื่อไม่ให้ข้อมูลหาย
      # - /var/run/docker.sock:/var/run/docker.sock # (Optional) เปิดบรรทัดนี้ถ้าอยากรัน Docker ซ้อนข้างใน
    ports:
      - 3100:3000 # พอร์ตสำหรับเข้าผ่าน HTTP
      - 3101:3001 # พอร์ตสำหรับเข้าผ่าน HTTPS
    shm_size: "1gb" # สำคัญมาก! ต้องตั้งค่านี้ไม่งั้น Browser ใน Webtop จะแครชบ่อย
    restart: unless-stopped

  webtop2:
      image: lscr.io/linuxserver/webtop:ubuntu-xfce
      container_name: webtop2
      security_opt:
        - seccomp:unconfined # จำเป็นเพื่อให้บางโปรแกรมทำงานได้สมบูรณ์
      environment:
        - PUID=1000 # User ID
        - PGID=1000 # Group ID
        - TZ=Asia/Bangkok
        - SUBFOLDER=/webtop2/ 
      shm_size: "1gb" 

  webtop3:
      image: lscr.io/linuxserver/webtop:ubuntu-xfce
      container_name: webtop3
      security_opt:
        - seccomp:unconfined # จำเป็นเพื่อให้บางโปรแกรมทำงานได้สมบูรณ์
      environment:
        - PUID=1000 # User ID
        - PGID=1000 # Group ID
        - TZ=Asia/Bangkok 
        - SUBFOLDER=/webtop3/ 
      shm_size: "1gb" 
