<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile - Web Containers Chain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { height: 100%; margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        .stars-small { width: 1px; height: 1px; background: transparent; position: absolute; box-shadow: 10vw 10vh #FFF, 50vw 50vh #FFF; opacity: 0.8; animation: starTwinkle 5s infinite alternate; }
        @keyframes starTwinkle { from { opacity: 0.3; } to { opacity: 1; } }

        .container { max-width: 600px; margin: 100px auto; text-align: center; position: relative; z-index: 10; }
        h1.main-title { color: #ffffff; font-size: 2.5em; font-weight: 300; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
        .sub-title { color: #00d2ff; font-size: 1.2em; margin-bottom: 40px; opacity: 0.8; }

        .glass-box { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 30px; }
        
        .user-info-display { font-size: 1.5em; margin-bottom: 30px; color: #fff; }
        .user-info-display span { color: #00d2ff; font-weight: bold; }

        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 1em; }
        .btn-warning { background: #f1c40f; color: #000; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* Modal Style */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #1a1a1a; border: 1px solid #333; padding: 30px; border-radius: 15px; width: 320px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        .form-group input { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="stars-small"></div>

    <div class="container">
        <h1 class="main-title">web containers chain</h1>
        <div class="sub-title">PERSONAL CONTROL PANEL</div>

        <div class="glass-box">
            <div class="user-info-display">Welcome, <span id="userName">User</span></div>
            
            <div class="btn-group">
                <button class="btn btn-warning" onclick="openModal()">🔑 Change Password</button>
                <button class="btn btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div id="pwdModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0">Update Password</h3>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="oldPwd">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPwd">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#555; color:#fff; padding:8px 15px;" onclick="closeModal()">Cancel</button>
                <button class="btn btn-warning" style="padding:8px 15px;" onclick="confirmChangePwd()">Update</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) {
            window.top.location.href = 'index.html';
        } else {
            document.getElementById('userName').innerText = currentUser.username;
        }

        function openModal() { document.getElementById('pwdModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('pwdModal').style.display = 'none'; }

        async function confirmChangePwd() {
            const oldP = document.getElementById('oldPwd').value;
            const newP = document.getElementById('newPwd').value;
            const res = await fetch('/api/change-password', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: currentUser.username, oldPassword: oldP, newPassword: newP})
            });
            const data = await res.json();
            if(data.success) {
                alert("Password updated successfully!");
                closeModal();
            } else {
                alert(data.message || "Error updating password");
            }
        }

        function logout() {
            sessionStorage.clear();
            window.top.location.href = 'index.html'; // หลุดออกจาก iframe ไปหน้า login
        }
    </script>
</body>
</html>
