<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCC</title>
    <style>
        /* --- 🌌 Deep Space Theme --- */
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; background: #090a0f; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        /* Header Bar - เน้นพื้นที่สำหรับเมนูล้วนๆ */
        .header {
            min-height: 50px;
            height: auto; 
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-wrap: wrap; align-items: center; 
            padding: 8px 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 1000; position: relative; gap: 10px;
        }

        .brand { 
            font-size: 1.1rem; font-weight: bold; color: white; letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); white-space: nowrap;
            margin-right: 10px;
        }

        /* Menu Container - ให้เมนูไหลได้อิสระ */
        .nav-menu { 
            display: flex; flex-wrap: wrap; gap: 6px; flex: 1;
        }

        .nav-item {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px; color: #ccc; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s; white-space: nowrap;
        }

        .nav-item:hover {
            background: rgba(0, 210, 255, 0.15); color: #00d2ff; border-color: #00d2ff;
        }

        .nav-item.active {
            background: #00d2ff; color: #000; font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        /* Main Viewport */
        .main-container { flex: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">WCC</div>
        <div class="nav-menu" id="menuContainer">
            </div>
    </div>

    <div class="main-container">
        <iframe id="mainFrame" name="mainFrame" src=""></iframe>
    </div>

    <script src="menu_config.js"></script>

    <script>
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            generateMenu();
        }

        function generateMenu() {
            const menuContainer = document.getElementById('menuContainer');
            const allowedPerms = currentUser.permissions || [];
            let firstAllowedUrl = '';

            // วนตามลำดับใน menu_config.js (Admin Panel และ User View จะอยู่ท้ายตามที่คุณเรียงไว้)
            appConfig.menus.forEach(menu => {
                const isAdmin = currentUser.role === 'admin' || currentUser.role === 'superadmin';
                const hasPermission = allowedPerms.includes(menu.id);

                // เงื่อนไขการแสดงผล:
                // 1. ถ้าเมนูเป็น adminOnly: true ต้องเป็น Admin เท่านั้นถึงจะเห็น
                // 2. ถ้าไม่ใช่ adminOnly: ต้องมี Permission หรือเป็น Admin
                let canSee = false;
                if (menu.adminOnly) {
                    if (isAdmin) canSee = true;
                } else {
                    if (hasPermission || isAdmin) canSee = true;
                }

                if (canSee) {
                    const btn = document.createElement('div');
                    btn.className = 'nav-item';
                    
                    // ปรับแต่งสีปุ่มพิเศษสำหรับ Admin Panel
                    if (menu.id === 'manage_users') {
                        btn.style.borderColor = '#f1c40f';
                        btn.style.color = '#f1c40f';
                    }
                    // ปรับแต่งสีปุ่มพิเศษสำหรับ User Panel
                    if (menu.id === 'users') {
                        btn.style.borderColor = '#2ecc71';
                        btn.style.color = '#2ecc71';
                    }

                    btn.innerText = menu.name;
                    btn.onclick = () => loadPage(menu.url, btn);
                    menuContainer.appendChild(btn);

                    if (!firstAllowedUrl) firstAllowedUrl = menu.url;
                }
            });

            // โหลดหน้าแรกอัตโนมัติ
            if (firstAllowedUrl) {
                const allBtns = menuContainer.querySelectorAll('.nav-item');
                if (allBtns.length > 0) allBtns[0].click();
            }
        }

        function loadPage(url, el) {
            document.getElementById('mainFrame').src = url;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if (el) el.classList.add('active');
        }
    </script>
</body>
</html>
